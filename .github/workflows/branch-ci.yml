name: Branch CI

on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
      - '*.txt'
    branches-ignore:
      - 'release*'

jobs:
  build:
    name: Branch CI (vault ${{ matrix.vault-image }})
    runs-on: ubuntu-latest
    # Guaranteed vault versions (single source of truth, policy in README.md): oldest supported by
    # HashiCorp, and latest; the latest one is also the default in VaultEnvironment. Non-blocking
    # 'latest' gives early warning about new vault releases.
    strategy:
      fail-fast: false
      matrix:
        vault-image: [ 'hashicorp/vault:1.19.5', 'hashicorp/vault:2.1.2' ]
        experimental: [ false ]
        include:
          - vault-image: 'hashicorp/vault:latest'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Maven Build
        run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Maven Verify
        run: mvn verify -B -Dvault.image=${{ matrix.vault-image }}
